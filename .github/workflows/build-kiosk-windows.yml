name: Build Kiosk Windows Installer

on:
  push:
    tags:
      - 'kiosk-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.0)'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build kiosk Windows installer
        run: pnpm kiosk make --platform win32
        env:
          NODE_ENV: production
          API_BASE_URL: http://172.30.1.87:4000/v1

      - name: List build artifacts
        run: |
          Get-ChildItem -Path apps/kiosk/out -Recurse | Format-Table Name, Length, LastWriteTime
        shell: pwsh

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-windows-installer
          path: |
            apps/kiosk/out/make/squirrel.windows/**/*.exe
            apps/kiosk/out/make/squirrel.windows/**/*.nupkg
            apps/kiosk/out/make/squirrel.windows/**/RELEASES
          if-no-files-found: error

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/kiosk-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/kiosk/out/make/squirrel.windows/**/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
